[package]
name = "ngotools_matrix_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
# Pinned exactly: the facade is the only place that absorbs SDK churn.
matrix-sdk = { version = "=0.19.1", default-features = false, features = [
    "e2e-encryption",
    "automatic-room-key-forwarding",
    "bundled-sqlite",
    "rustls-aws-lc-rs",
] }
matrix-sdk-ui = { version = "=0.19.1", default-features = false }
anyhow = "1.0.75"
eyeball-im = "0.9.1"
futures-util = "0.3.34"
imbl = "7.0.2"
mime = "0.3.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", default-features = false }
rustls-platform-verifier = "=0.7.1"

[profile.release]
# Size-oriented like Element X's `small-release-stripped` (opt-level "s").
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.dev]
# Keep simulator/emulator builds small on disk and crypto reasonably fast.
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 1
