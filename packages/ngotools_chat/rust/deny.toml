# License gate for the app binary: no GPL/LGPL/AGPL (and no other strong
# copyleft). MPL-2.0 is file-level copyleft and allowed as long as MPL files
# stay unmodified; it is listed in the third-party notices.
[graph]
targets = [
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
]
all-features = false
no-default-features = false

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
]
confidence-threshold = 0.9

# allo-isolate (flutter_rust_bridge runtime) ships only a LICENSE file (Apache-2.0).
[[licenses.clarify]]
crate = "allo-isolate"
expression = "Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0x0 }]

[advisories]
# Vulnerable, unsound and unmaintained crates fail the gate; exceptions need an
# `ignore` entry with a reason.
unmaintained = "all"
yanked = "deny"

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
