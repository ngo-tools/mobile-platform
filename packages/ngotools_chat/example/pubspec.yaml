name: ngotools_chat_example
description: Development harness and end-to-end tests for ngotools_chat.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^5.1.0
  image_picker: ^1.2.3
  ngotools_chat: ^0.1.0-dev.1
  ngotools_chat_module: ^0.1.0-dev.1
  ngotools_design_system: ^0.1.0-dev.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
