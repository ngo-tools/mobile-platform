name: golden_app
description: Secret-free reference shell for an NGO.Tools organization app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ngotools_api: ^0.1.0-dev.1
  ngotools_auth: ^0.1.0-dev.1
  ngotools_chat_module: ^0.1.0-dev.1
  ngotools_contacts: ^0.1.0-dev.1
  ngotools_design_system: ^0.1.0-dev.1
  ngotools_events: ^0.1.0-dev.1
  ngotools_mobile_core: ^0.1.0-dev.1
  ngotools_navigation: ^0.1.0-dev.1
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ngotools_testing: ^0.1.0-dev.1

flutter:
  uses-material-design: true
