apiVersion: mobile.ngo.tools/v1alpha1
kind: OrganizationApp
metadata:
  id: mob_01J00000000000000000000000
  name: Synthetic Golden App
  version: 0.1.0
owner:
  tenant: synthetic-demo
  repositoryModel: managed_by_ngotools
identifiers:
  ios:
    development: tools.ngo.mobile.golden.dev
    staging: tools.ngo.mobile.golden.staging
    production: tools.ngo.mobile.golden
  android:
    development: tools.ngo.mobile.golden.dev
    staging: tools.ngo.mobile.golden.staging
    production: tools.ngo.mobile.golden
backend:
  minimumContractVersion: 2.0.0
  environments:
    development:
      id: env_01J00000000000000000000000
      apiBaseUrl: https://development.example.invalid/api/v2
      configRevision: cfg_01J00000000000000000000000
      attestationMode: disabled
      oidc:
        issuer: https://identity.development.example.invalid/realms/synthetic
        clientId: mobile-01j00000000000000000000000
        redirectUri: ngotools-01j00000000000000000000000://oauth/callback
        scopes: [openid, profile, email, offline_access]
    staging:
      id: env_01J00000000000000000000001
      apiBaseUrl: https://staging.example.invalid/api/v2
      configRevision: cfg_01J00000000000000000000001
      attestationMode: test
      oidc:
        issuer: https://identity.staging.example.invalid/realms/synthetic
        clientId: mobile-01j00000000000000000000001
        redirectUri: ngotools-01j00000000000000000000001://oauth/callback
        scopes: [openid, profile, email, offline_access]
    production:
      id: env_01J00000000000000000000002
      apiBaseUrl: https://production.example.invalid/api/v2
      configRevision: cfg_01J00000000000000000000002
      attestationMode: enforced
      oidc:
        issuer: https://identity.production.example.invalid/realms/synthetic
        clientId: mobile-01j00000000000000000000002
        redirectUri: ngotools-01j00000000000000000000002://oauth/callback
        scopes: [openid, profile, email, offline_access]
auth:
  flow: authorization_code_pkce
  userAgent: external
localization:
  defaultLocale: de
  locales:
    - de
    - en
support:
  url: https://support.example.invalid/golden
  privacyUrl: https://privacy.example.invalid/golden
permissions:
  apiScopes:
    - profile:read
    - contacts:read
    - contacts:write
  device: []
features:
  modules:
    - profile
    - contacts
branding:
  template: community
distribution:
  ios: testflight
  android: closed_testing
deepLinks:
  hosts:
    - mobile.example.invalid
