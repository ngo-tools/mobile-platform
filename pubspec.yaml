name: ngo_tools_mobile_platform
description: Tooling and workspace root for the NGO.Tools mobile platform.
publish_to: none
version: 0.1.0-dev.1

environment:
  sdk: ^3.11.0

workspace:
  - packages/ngotools_api
  - packages/ngotools_auth
  - packages/ngotools_contacts
  - packages/ngotools_design_system
  - packages/ngotools_mobile_core
  - packages/ngotools_navigation
  - packages/ngotools_testing
  - example/golden_app

dependencies:
  crypto: ^3.0.7
  json_schema: ^5.2.2
  path: ^1.9.1
  yaml: ^3.1.4

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.26.3
