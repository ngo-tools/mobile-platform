apiVersion: mobile.ngo.tools/v1alpha1
kind: MobileModule
metadata:
  id: contacts
  name:
    de: Kontakte
    en: Contacts
  summary:
    de: Durchsucht und verwaltet Kontakte mit kontrolliertem Offline-Verhalten.
    en: Searches and manages contacts with controlled offline behavior.
status: available
delivery:
  type: package
  package: ngotools_contacts
requires:
  modules:
    - profile
  apiScopes:
    - contacts:read
    - contacts:write
  features:
    - contacts
  permissions:
    - contacts:read
    - contacts:write
  devicePermissions: []
deepLinks:
  - /contacts/{id}
