include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - packages/ngotools_api/lib/src/generated/**
    # flutter_rust_bridge output and vendored cargokit build tool
    - packages/ngotools_chat/lib/src/rust/**
    - packages/ngotools_chat/cargokit/**
    # Android builds copy the build tool into the example's build output
    - packages/ngotools_chat/example/build/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error

linter:
  rules:
    always_declare_return_types: true
    avoid_dynamic_calls: true
    cancel_subscriptions: true
    close_sinks: true
    directives_ordering: true
    discarded_futures: true
    prefer_final_locals: true
    sort_constructors_first: true
    unawaited_futures: true
