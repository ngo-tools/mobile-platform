openapi: 3.0.3
info:
  title: NGO.Tools Mobile Runtime API
  version: 2.0.0
  description: Secret-free contract for the mobile runtime and release approval.
servers:
  - url: https://api.example.invalid
    description: Synthetic placeholder; apps replace this with their fixed API origin.
tags:
  - name: Runtime
  - name: Contacts
  - name: Events
  - name: Release
paths:
  /api/me:
    get:
      operationId: getCurrentUser
      tags: [Runtime]
      summary: Get the authenticated user and effective access metadata
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/capabilities:
    get:
      operationId: getCapabilities
      tags: [Runtime]
      summary: Get effective tenant and account capabilities
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Effective runtime capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/contacts/search:
    post:
      operationId: searchContacts
      tags: [Contacts]
      summary: Search contacts using the server-authorized mobile projection
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactSearchRequest'
      responses:
        '200':
          description: Paginated contacts matching the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v2/contacts/{contactId}:
    get:
      operationId: getContact
      tags: [Contacts]
      summary: Get one contact and its addresses
      security:
        - bearerAuth: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: include
          in: query
          required: false
          schema:
            type: string
            enum: [addresses]
            default: addresses
      responses:
        '200':
          description: Contact details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v2/contact-mutations:
    post:
      operationId: createContact
      tags: [Contacts]
      summary: Create one contact through the retry-safe mobile boundary
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactRequest'
      responses:
        '200':
          description: An earlier successful create was replayed
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '201':
          description: Contact created
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ContactMutationConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v2/contact-mutations/{contactId}:
    patch:
      operationId: updateContact
      tags: [Contacts]
      summary: Update one contact from an exact opaque base version
      security:
        - bearerAuth: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContactRequest'
      responses:
        '200':
          description: Contact updated or an earlier successful update replayed
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ContactMutationConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v2/events:
    get:
      operationId: listEvents
      tags: [Events]
      summary: List visible events starting in a date range
      description: >-
        Events of calendars the user may see, plus events the user's contact serves
        at or is asked about. Dates are tenant-local calendar days; without a range
        the server returns today and the next 60 days. A range may span at most 366
        days.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          description: Tenant-local calendar day in `YYYY-MM-DD` format.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: to
          in: query
          required: false
          description: Tenant-local calendar day in `YYYY-MM-DD` format.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        '200':
          description: Events ordered by start
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v2/events/{eventId}:
    get:
      operationId: getEvent
      tags: [Events]
      summary: Get one event with agenda and team
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v2/event-assignments:
    get:
      operationId: listEventAssignments
      tags: [Events]
      summary: List the user's own assignments for today and upcoming events
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Own assignments ordered by event start
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAssignmentCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/event-availabilities:
    get:
      operationId: listEventAvailabilities
      tags: [Events]
      summary: List upcoming availability requests with the current answer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Availability requests ordered by event start
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAvailabilityCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/event-availabilities/{eventId}/{serviceId}:
    put:
      operationId: updateEventAvailability
      tags: [Events]
      summary: Answer whether the user is available for a service of an upcoming event
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventAvailabilityRequest'
      responses:
        '200':
          description: Stored availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAvailabilityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      operationId: deleteEventAvailability
      tags: [Events]
      summary: Withdraw the user's answer for a service of an upcoming event
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Answer withdrawn
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v2/mobile-app-releases:
    post:
      operationId: startMobileAppRelease
      tags: [Release]
      summary: Start approval for one immutable signed mobile artifact
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileAppReleaseRequest'
      responses:
        '201':
          description: Release approval was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAppReleaseStartResponse'
        '404':
          $ref: '#/components/responses/ReleaseError'
        '409':
          $ref: '#/components/responses/ReleaseError'
        '422':
          $ref: '#/components/responses/ReleaseError'
  /api/v2/mobile-app-releases/{releaseRequestId}/poll:
    post:
      operationId: pollMobileAppRelease
      tags: [Release]
      summary: Poll a release approval with its one-time token
      security: []
      parameters:
        - name: releaseRequestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileAppReleasePollRequest'
      responses:
        '200':
          description: Release was approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAppReleasePollResponse'
        '202':
          description: Release is waiting for approval
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAppReleasePollResponse'
        '403':
          $ref: '#/components/responses/ReleaseError'
        '404':
          $ref: '#/components/responses/ReleaseError'
        '410':
          $ref: '#/components/responses/ReleaseError'
        '422':
          $ref: '#/components/responses/ReleaseError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable UUID retained for the lifetime of one local draft
      schema:
        type: string
        format: uuid
  headers:
    IdempotencyReplayed:
      description: Whether this response replays an earlier successful mutation
      schema:
        type: boolean
  responses:
    Unauthorized:
      description: Authentication is missing or expired
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: The operation is unavailable to this account
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: The requested record does not exist or is not visible
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationFailed:
      description: The request parameters are invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ContactMutationConflict:
      description: The idempotency key is invalid or the base version is stale
      headers:
        Cache-Control:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ReleaseError:
      description: Release approval failed
      headers:
        Cache-Control:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [user, permissions, features]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
        features:
          type: array
          uniqueItems: true
          items:
            type: string
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/RuntimeCapabilities'
    RuntimeCapabilities:
      type: object
      additionalProperties: false
      required: [schema_version, features, imports]
      properties:
        schema_version:
          type: integer
          minimum: 1
        features:
          type: array
          uniqueItems: true
          items:
            type: string
        imports:
          $ref: '#/components/schemas/ImportCapabilities'
    ImportCapabilities:
      type: object
      additionalProperties: false
      required: [enabled, types]
      properties:
        enabled:
          type: boolean
        types:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ImportCapability'
    ImportCapability:
      type: object
      additionalProperties: true
      required:
        - supported
        - required_feature
        - feature_enabled
        - permission_granted
        - available
        - requires
        - batch_import_supported
        - blockers
      properties:
        label:
          type: string
          nullable: true
        supported:
          type: boolean
        required_feature:
          type: string
        feature_enabled:
          type: boolean
        permission_granted:
          type: boolean
        available:
          type: boolean
        requires:
          type: array
          uniqueItems: true
          items:
            type: string
        batch_import_supported:
          type: boolean
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityBlocker'
        limits:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ImportLimits'
    CapabilityBlocker:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ImportLimits:
      type: object
      additionalProperties: false
      required: [max_batch_size]
      properties:
        max_batch_size:
          type: integer
          minimum: 1
    ContactSearchRequest:
      type: object
      additionalProperties: false
      properties:
        search:
          $ref: '#/components/schemas/ContactSearchTerm'
        sort:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/ContactSort'
    ContactSearchTerm:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          maxLength: 200
        case_sensitive:
          type: boolean
          default: false
    ContactSort:
      type: object
      additionalProperties: false
      required: [field, direction]
      properties:
        field:
          type: string
          enum: [name, first_name, last_name, updated_at, created_at, id]
        direction:
          type: string
          enum: [asc, desc]
    ContactCollectionResponse:
      type: object
      additionalProperties: true
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    ContactResponse:
      type: object
      additionalProperties: true
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Contact'
    CreateContactRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - name
        - first_name
        - last_name
        - email
        - salutation
        - title
        - gender
        - birthday
      properties:
        type:
          type: string
          enum: [person, organization]
        name:
          type: string
          maxLength: 255
          nullable: true
        first_name:
          type: string
          maxLength: 255
          nullable: true
        last_name:
          type: string
          maxLength: 255
          nullable: true
        email:
          type: string
          format: email
          maxLength: 255
          nullable: true
        salutation:
          type: string
          maxLength: 255
          nullable: true
        title:
          type: string
          maxLength: 255
          nullable: true
        gender:
          type: string
          maxLength: 255
          nullable: true
        birthday:
          type: string
          pattern: '^\\d{4}-\\d{2}-\\d{2}$'
          nullable: true
    UpdateContactRequest:
      type: object
      additionalProperties: false
      required:
        - base_version
        - name
        - first_name
        - last_name
        - email
        - salutation
        - title
        - gender
        - birthday
      properties:
        base_version:
          type: string
          pattern: '^[a-f0-9]{64}$'
        name:
          type: string
          maxLength: 255
          nullable: true
        first_name:
          type: string
          maxLength: 255
          nullable: true
        last_name:
          type: string
          maxLength: 255
          nullable: true
        email:
          type: string
          format: email
          maxLength: 255
          nullable: true
        salutation:
          type: string
          maxLength: 255
          nullable: true
        title:
          type: string
          maxLength: 255
          nullable: true
        gender:
          type: string
          maxLength: 255
          nullable: true
        birthday:
          type: string
          pattern: '^\\d{4}-\\d{2}-\\d{2}$'
          nullable: true
    Contact:
      type: object
      additionalProperties: true
      required: [id, type, version]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        version:
          type: string
          pattern: '^[a-f0-9]{64}$'
        name:
          type: string
          nullable: true
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        salutation:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        gender:
          type: string
          nullable: true
        birthday:
          type: string
          format: date
          nullable: true
        active_address_id:
          type: integer
          format: int64
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/ContactAddress'
    ContactAddress:
      type: object
      additionalProperties: true
      required: [id]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          nullable: true
        line1:
          type: string
          nullable: true
        line2:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
    PaginationLinks:
      type: object
      additionalProperties: true
      properties:
        first:
          type: string
          format: uri
          nullable: true
        last:
          type: string
          format: uri
          nullable: true
        prev:
          type: string
          format: uri
          nullable: true
        next:
          type: string
          format: uri
          nullable: true
    PaginationMeta:
      type: object
      additionalProperties: true
      required: [current_page, per_page, total]
      properties:
        current_page:
          type: integer
          minimum: 1
        last_page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    MobileAppReleaseRequest:
      type: object
      additionalProperties: false
      required:
        - app_id
        - platform
        - channel
        - version
        - build_number
        - source_revision
        - artifact_sha256
        - sdk_version
        - contract_version
      properties:
        app_id:
          type: string
        platform:
          type: string
          enum: [ios, android]
        channel:
          type: string
          enum: [internal, beta, production]
        version:
          type: string
        build_number:
          type: string
        source_revision:
          type: string
          pattern: '^[a-f0-9]{40}$'
        artifact_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        sdk_version:
          type: string
        contract_version:
          type: string
    MobileAppReleasePollRequest:
      type: object
      additionalProperties: false
      required: [poll_token]
      properties:
        poll_token:
          type: string
          minLength: 64
          maxLength: 64
    MobileAppReleaseStartResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/MobileAppReleaseApproval'
    MobileAppReleaseApproval:
      type: object
      additionalProperties: false
      required:
        - release_request_id
        - poll_token
        - user_code
        - authorization_url
        - expires_in
        - poll_interval
      properties:
        release_request_id:
          type: string
        poll_token:
          type: string
        user_code:
          type: string
        authorization_url:
          type: string
          format: uri
        expires_in:
          type: integer
          minimum: 1
        poll_interval:
          type: integer
          minimum: 1
    MobileAppReleasePollResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved]
        code:
          type: string
          nullable: true
        release:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MobileAppApprovedRelease'
    MobileAppApprovedRelease:
      type: object
      additionalProperties: false
      required:
        - id
        - app_id
        - platform
        - channel
        - version
        - build_number
        - status
        - management_url
      properties:
        id:
          type: string
        app_id:
          type: string
        platform:
          type: string
          enum: [ios, android]
        channel:
          type: string
          enum: [internal, beta, production]
        version:
          type: string
        build_number:
          type: string
        status:
          type: string
          enum: [approved]
        management_url:
          type: string
          format: uri
    EventCollectionResponse:
      type: object
      additionalProperties: true
      required: [data]
