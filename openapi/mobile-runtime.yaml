openapi: 3.0.3
info:
  title: NGO.Tools Mobile Runtime API
  version: 2.0.0
  description: Secret-free contract for the mobile runtime and release approval.
servers:
  - url: https://api.example.invalid
    description: Synthetic placeholder; apps replace this with their fixed API origin.
tags:
  - name: Runtime
  - name: Release
paths:
  /api/me:
    get:
      operationId: getCurrentUser
      tags: [Runtime]
      summary: Get the authenticated user and effective access metadata
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/capabilities:
    get:
      operationId: getCapabilities
      tags: [Runtime]
      summary: Get effective tenant and account capabilities
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Effective runtime capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/mobile-app-releases:
    post:
      operationId: startMobileAppRelease
      tags: [Release]
      summary: Start approval for one immutable signed mobile artifact
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileAppReleaseRequest'
      responses:
        '201':
          description: Release approval was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAppReleaseStartResponse'
        '404':
          $ref: '#/components/responses/ReleaseError'
        '409':
          $ref: '#/components/responses/ReleaseError'
        '422':
          $ref: '#/components/responses/ReleaseError'
  /api/v2/mobile-app-releases/{releaseRequestId}/poll:
    post:
      operationId: pollMobileAppRelease
      tags: [Release]
      summary: Poll a release approval with its one-time token
      security: []
      parameters:
        - name: releaseRequestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileAppReleasePollRequest'
      responses:
        '200':
          description: Release was approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAppReleasePollResponse'
        '202':
          description: Release is waiting for approval
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAppReleasePollResponse'
        '403':
          $ref: '#/components/responses/ReleaseError'
        '404':
          $ref: '#/components/responses/ReleaseError'
        '410':
          $ref: '#/components/responses/ReleaseError'
        '422':
          $ref: '#/components/responses/ReleaseError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Authentication is missing or expired
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: The operation is unavailable to this account
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ReleaseError:
      description: Release approval failed
      headers:
        Cache-Control:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [user, permissions, features]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
        features:
          type: array
          uniqueItems: true
          items:
            type: string
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/RuntimeCapabilities'
    RuntimeCapabilities:
      type: object
      additionalProperties: false
      required: [schema_version, features, imports]
      properties:
        schema_version:
          type: integer
          minimum: 1
        features:
          type: array
          uniqueItems: true
          items:
            type: string
        imports:
          $ref: '#/components/schemas/ImportCapabilities'
    ImportCapabilities:
      type: object
      additionalProperties: false
      required: [enabled, types]
      properties:
        enabled:
          type: boolean
        types:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ImportCapability'
    ImportCapability:
      type: object
      additionalProperties: true
      required:
        - supported
        - required_feature
        - feature_enabled
        - permission_granted
        - available
        - requires
        - batch_import_supported
        - blockers
      properties:
        label:
          type: string
          nullable: true
        supported:
          type: boolean
        required_feature:
          type: string
        feature_enabled:
          type: boolean
        permission_granted:
          type: boolean
        available:
          type: boolean
        requires:
          type: array
          uniqueItems: true
          items:
            type: string
        batch_import_supported:
          type: boolean
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityBlocker'
        limits:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ImportLimits'
    CapabilityBlocker:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ImportLimits:
      type: object
      additionalProperties: false
      required: [max_batch_size]
      properties:
        max_batch_size:
          type: integer
          minimum: 1
    MobileAppReleaseRequest:
      type: object
      additionalProperties: false
      required:
        - app_id
        - platform
        - channel
        - version
        - build_number
        - source_revision
        - artifact_sha256
        - sdk_version
        - contract_version
      properties:
        app_id:
          type: string
        platform:
          type: string
          enum: [ios, android]
        channel:
          type: string
          enum: [internal, beta, production]
        version:
          type: string
        build_number:
          type: string
        source_revision:
          type: string
          pattern: '^[a-f0-9]{40}$'
        artifact_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        sdk_version:
          type: string
        contract_version:
          type: string
    MobileAppReleasePollRequest:
      type: object
      additionalProperties: false
      required: [poll_token]
      properties:
        poll_token:
          type: string
          minLength: 64
          maxLength: 64
    MobileAppReleaseStartResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/MobileAppReleaseApproval'
    MobileAppReleaseApproval:
      type: object
      additionalProperties: false
      required:
        - release_request_id
        - poll_token
        - user_code
        - authorization_url
        - expires_in
        - poll_interval
      properties:
        release_request_id:
          type: string
        poll_token:
          type: string
        user_code:
          type: string
        authorization_url:
          type: string
          format: uri
        expires_in:
          type: integer
          minimum: 1
        poll_interval:
          type: integer
          minimum: 1
    MobileAppReleasePollResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved]
        code:
          type: string
          nullable: true
        release:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MobileAppApprovedRelease'
    MobileAppApprovedRelease:
      type: object
      additionalProperties: false
      required:
        - id
        - app_id
        - platform
        - channel
        - version
        - build_number
        - status
        - management_url
      properties:
        id:
          type: string
        app_id:
          type: string
        platform:
          type: string
          enum: [ios, android]
        channel:
          type: string
          enum: [internal, beta, production]
        version:
          type: string
        build_number:
          type: string
        status:
          type: string
          enum: [approved]
        management_url:
          type: string
          format: uri
    ProblemDetails:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        error_code:
          type: string
        message:
          type: string
        request_id:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
